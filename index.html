<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIVE COUNTRY BATTLE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;

    background:
        radial-gradient(circle at top left,#1e3c72,#0f172a 60%);

    min-height:100vh;

    padding:30px;

    overflow-x:hidden;
}

/* BACKGROUND */

body::before{
    content:"";

    position:fixed;
    inset:0;

    background-image:
        radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);

    background-size:35px 35px;

    animation:bgMove 15s linear infinite;

    pointer-events:none;
}

@keyframes bgMove{
    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(35px);
    }
}

/* CONTAINER */

.container{
    width:520px;
}

/* TITLE */

.title{
    color:white;

    font-size:40px;
    font-weight:800;

    margin-bottom:30px;

    text-shadow:
        0 0 20px rgba(0,255,255,.45);
}

/* CARD */

.country-card{

    position:relative;

    display:flex;
    align-items:center;
    justify-content:space-between;

    width:100%;

    padding:18px 22px;

    margin-bottom:18px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(36,59,85,.95),
            rgba(20,30,48,.95)
        );

    border:2px solid rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 20px rgba(0,170,255,.18),
        inset 0 0 10px rgba(255,255,255,.04);

    transition:.25s;
}

.country-card:hover{

    transform:
        translateY(-5px)
        scale(1.02);

    box-shadow:
        0 0 30px rgba(0,200,255,.35);
}

/* LEADER */

.top-country{

    border:2px solid gold;

    background:
        linear-gradient(
            135deg,
            rgba(255,190,0,.18),
            rgba(20,30,48,.98)
        );

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:
            0 0 10px gold;
    }

    50%{
        box-shadow:
            0 0 35px gold;
    }

    100%{
        box-shadow:
            0 0 10px gold;
    }
}

.leader-tag{

    position:absolute;

    top:-10px;
    right:20px;

    background:gold;

    color:black;

    font-size:12px;
    font-weight:800;

    padding:5px 12px;

    border-radius:999px;

    box-shadow:
        0 0 15px gold;
}

/* LEFT SIDE */

.country-left{

    display:flex;
    align-items:center;

    gap:14px;
}

/* RANK */

.rank{

    width:36px;
    height:36px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-weight:800;
    font-size:14px;

    background:
        linear-gradient(
            135deg,
            #ff00cc,
            #3333ff
        );

    box-shadow:
        0 0 15px rgba(255,0,200,.45);
}

/* FLAG */

.flag{

    width:44px;
    height:30px;

    object-fit:cover;

    border-radius:6px;

    box-shadow:
        0 0 12px rgba(255,255,255,.25);
}

/* COUNTRY NAME */

.country-name{

    color:white;

    font-size:20px;
    font-weight:700;

    letter-spacing:.5px;
}

/* LIVE DOT */

.live-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#00ff66;

    box-shadow:
        0 0 15px #00ff66;

    animation:livePulse 1s infinite;
}

@keyframes livePulse{

    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.6);
        opacity:.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

/* RIGHT SIDE */

.country-right{

    display:flex;
    align-items:center;

    gap:18px;
}

/* BUTTONS */

.score,
.gift{

    min-width:90px;
    height:46px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;
}

/* SCORE */

.score{

    background:
        rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.08),
        0 0 10px rgba(0,0,0,.25);
}

.score:hover{
    transform:scale(1.05);
}

/* TROPHY BUTTON */

.gift{

    background:
        linear-gradient(
            135deg,
            #ffcc00,
            #ff6f00
        );

    box-shadow:
        0 0 18px rgba(255,170,0,.5);
}

.gift:hover{

    transform:scale(1.08);

    box-shadow:
        0 0 28px rgba(255,170,0,.8);
}

</style>
</head>

<body>
