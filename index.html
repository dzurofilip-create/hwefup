<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">

<style>
body{
    margin:0;
    background:transparent;
    font-family:Arial;
    overflow:hidden;
}

/* BOARD */
.board{
    width:470px;
    position:relative;
}

/* ROW */
.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-radius:14px;
    margin-bottom:6px;
    position:absolute;
    width:100%;
    box-sizing:border-box;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
}

/* FIRST */
.gold{
    background:linear-gradient(90deg,#d6b15f,#f2d27c);
    box-shadow:0 0 15px rgba(255,215,0,0.6);
}

/* OSTATNÉ */
.silver{
    background:rgba(180,180,180,0.2);
    backdrop-filter:blur(6px);
}

/* LEFT */
.club{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 6px black,0 0 10px black;
    font-size:16px;
}

/* LOGO */
.logo{
    width:28px;
    height:28px;
    border-radius:6px;
    object-fit:cover;
    background:#222;
}

/* RIGHT SIDE */
.right{
    display:flex;
    align-items:center;
    gap:8px;
}

/* SCORE BOX */
.score{
    background:rgba(255,255,255,0.92);
    padding:4px 10px;
    border-radius:8px;
    color:black;
    font-weight:bold;
    min-width:70px;
    text-align:center;
    font-size:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.25);
}

/* TITLES BOX - rovnaký štýl ako score */
.titles{
    background:rgba(255,255,255,0.92);
    padding:4px 10px;
    border-radius:8px;
    color:black;
    font-weight:bold;
    min-width:70px;
    text-align:center;
    font-size:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.25);
}

/* +POINTS */
.points{
    position:absolute;
    right:155px;
    color:#00ff6a;
    font-weight:bold;
    font-size:18px;
    text-shadow:0 0 6px black;
    animation:pop 1s forwards;
    pointer-events:none;
}

@keyframes pop{
    0%{
        opacity:0;
        transform:translateY(10px) scale(0.8);
    }

    50%{
        opacity:1;
        transform:translateY(-10px) scale(1.2);
    }

    100%{
        opacity:0;
        transform:translateY(-25px) scale(1);
    }
}
</style>
</head>

<body>

<div id="board" class="board"></div>

<script>

// KLUBY
let clubs = [

},
{

{

},

    score:900,
    titles:1,
    logo:"https://th.bing.com/th/id/OIP.FMOLNpqhkI29f9fWQ-DdLgHaHk?o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3"
},
{
    name:"Spartak Trnava",
    score:900,
    titles:0,
    logo:"https://tse4.mm.bing.net/th/id/OIP.pqQOzXM6KRfIUoQ4hI_UzAHaHk?rs=1&pid=ImgDetMain&o=7&rm=3"
},
{
    name:"FC Košice",
    score:0,
    titles:0,
    logo:"https://tse3.mm.bing.net/th/id/OIP.-kNYcPcmVfieIARABJqGzAHaHa?rs=1&pid=ImgDetMain&o=7&rm=3"
},
{
    name:"FC Nitra",
    score:12000,
    titles:0,
    logo:"https://th.bing.com/th/id/R.d836fb993b547b9ca32368dca9b19042?rik=i4s%2brGJzWFth6A&pid=ImgRaw&r=0"
}
]

const board = document.getElementById("board")

function draw(){

    clubs.sort((a,b)=>b.score-a.score)

    clubs.forEach((c,i)=>{

        let el = document.getElementById(c.name)

        if(!el){

            el = document.createElement("div")
            el.id = c.name
            el.className = "row"

            el.innerHTML = `
                <div class="club">
                    <img class="logo" src="${c.logo}">
                    ${c.name}
                </div>

                <div class="right">
                    <div class="score">
                        ${c.score}
                    </div>

                    <div class="titles">
                        🏆 ${c.titles}
                    </div>
                </div>
            `

            board.appendChild(el)
        }

        el.className = i == 0 ? "row gold" : "row silver"

        el.style.transform = `translateY(${i * 60}px)`

        el.querySelector(".score").innerText = c.score

        el.querySelector(".titles").innerHTML = `🏆 ${c.titles}`
    })
}

/* SOCKET */
const socket = new WebSocket("ws://localhost:3000")

socket.onmessage = function(event){

    let data = JSON.parse(event.data)

    let c = clubs.find(x => x.name === data.club)

    if(c){
        c.score += data.points
    }

    draw()

    let el = document.getElementById(data.club)

    if(el){

        let pop = document.createElement("div")

        pop.className = "points"

        pop.innerText = "+" + data.points

        el.appendChild(pop)

        setTimeout(()=>{
            pop.remove()
        },1000)
    }
}

/* 🏆 ADD TITLE */
function addTitle(clubName, amount = 1){

    let club = clubs.find(c => c.name === clubName)

    if(!club) return

    club.titles += amount

    draw()
}

/* ❌ REMOVE TITLE */
function removeTitle(clubName, amount = 1){

    let club = clubs.find(c => c.name === clubName)

    if(!club) return

    club.titles -= amount

    if(club.titles < 0){
        club.titles = 0
    }

    draw()
}

draw()

</script>

</body>
</html>
