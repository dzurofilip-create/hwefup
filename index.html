<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIVE SÚBOJ KRAJÍN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;

    background:
        radial-gradient(circle at top left,#12284a,#081120 70%);

    min-height:100vh;

    padding:20px;

    overflow:hidden;
}

/* BACKGROUND */

body::before{
    content:"";

    position:fixed;
    inset:0;

    background-image:
        radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);

    background-size:32px 32px;

    animation:bgMove 14s linear infinite;

    pointer-events:none;
}

@keyframes bgMove{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(32px);
    }
}

/* MAIN */

.container{
    width:520px;
}

/* TITLE */

.title{

    display:flex;
    align-items:center;

    gap:12px;

    color:white;

    font-size:42px;
    font-weight:800;

    margin-bottom:25px;

    text-shadow:
        0 0 20px rgba(0,255,255,.35);
}

.title-icon{
    font-size:34px;
}

/* CARD */

.country-card{

    position:relative;

    display:flex;
    justify-content:space-between;
    align-items:center;

    width:100%;

    padding:16px 20px;

    margin-bottom:16px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            rgba(35,58,90,.96),
            rgba(12,18,28,.96)
        );

    border:2px solid rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    box-shadow:
        0 0 18px rgba(0,170,255,.15),
        inset 0 0 10px rgba(255,255,255,.03);

    transition:
        transform .35s,
        box-shadow .35s;
}

.country-card:hover{

    transform:
        translateY(-4px)
        scale(1.02);

    box-shadow:
        0 0 28px rgba(0,200,255,.4);
}

/* TOP COUNTRY */

.top-country{

    border:2px solid gold;

    box-shadow:
        0 0 25px rgba(255,215,0,.5);

    animation:pulse 1.6s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:
            0 0 10px gold;
    }

    50%{
        box-shadow:
            0 0 30px gold;
    }

    100%{
        box-shadow:
            0 0 10px gold;
    }
}

/* LEADER */

.leader{

    position:absolute;

    top:-10px;
    right:18px;

    background:gold;

    color:black;

    font-size:11px;
    font-weight:800;

    padding:5px 12px;

    border-radius:999px;

    box-shadow:
        0 0 14px gold;
}

/* LEFT SIDE */

.country-left{

    display:flex;
    align-items:center;

    gap:14px;
}

/* RANK */

.rank{

    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:13px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #ff00cc,
            #5b2dff
        );

    box-shadow:
        0 0 14px rgba(255,0,200,.4);
}

/* FLAG */

.flag{

    width:42px;
    height:28px;

    object-fit:cover;

    border-radius:6px;

    box-shadow:
        0 0 10px rgba(255,255,255,.25);
}

/* COUNTRY NAME */

.country-name{

    color:white;

    font-size:20px;
    font-weight:700;
}

/* LIVE DOT */

.live-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#00ff66;

    box-shadow:
        0 0 12px #00ff66;

    animation:livePulse 1s infinite;
}

@keyframes livePulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.6);
    }

    100%{
        transform:scale(1);
    }
}

/* RIGHT SIDE */

.country-right{

    display:flex;
    align-items:center;

    gap:18px;
}

/* SCORE */

.score{

    min-width:90px;
    height:44px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:15px;
    font-weight:700;

    background:
        rgba(255,255,255,.08);

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.05);
}

/* GIFT */

.gift{

    min-width:90px;
    height:44px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:15px;
    font-weight:700;

    background:
        linear-gradient(
            135deg,
            #ffcc00,
            #ff8800
        );

    box-shadow:
        0 0 16px rgba(255,170,0,.45);
}

/* SMOOTH MOVE */

.country-card{
    animation:fadeIn .35s;
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0px);
    }
}

</style>
</head>

<body>

<div class="container">

<div class="title">
<div class="title-icon">🌍</div>
<div>LIVE SÚBOJ KRAJÍN</div>
</div>

<div id="leaderboard"></div>

</div>

<script>

/* ========================= */
/* KRAJINY */
/* ========================= */

const countries = [

{
    name:"Slovensko",
    code:"sk",
    score:0,
    gifts:0
},

{
    name:"Česko",
    code:"cz",
    score:0,
    gifts:0
},

{
    name:"Poľsko",
    code:"pl",
    score:0,
    gifts:0
},

{
    name:"Maďarsko",
    code:"hu",
    score:0,
    gifts:0
},

{
    name:"Ukrajina",
    code:"ua",
    score:0,
    gifts:0
},

{
    name:"Nemecko",
    code:"de",
    score:0,
    gifts:0
},

{
    name:"Chorvátsko",
    code:"hr",
    score:0,
    gifts:0
},

{
    name:"Srbsko",
    code:"rs",
    score:0,
    gifts:0
},

{
    name:"Rakúsko",
    code:"at",
    score:0,
    gifts:0
},

{
    name:"Albánsko",
    code:"al",
    score:0,
    gifts:0
}

];

/* ========================= */
/* RENDER */
/* ========================= */

function renderLeaderboard(){

    const leaderboard =
        document.getElementById("leaderboard");

    leaderboard.innerHTML = "";

    countries
    .sort((a,b)=>b.score-a.score)
    .forEach((country,index)=>{

        leaderboard.innerHTML += `

        <div class="
            country-card
            ${index === 0 ? "top-country" : ""}
        ">

            ${
                index === 0
                ?
                `<div class="leader">
                    LEADER
                </div>`
                :
                ""
            }

            <div class="country-left">

                <div class="rank">
                    #${index + 1}
                </div>

                <img
                    class="flag"
                    src="https://flagcdn.com/w80/${country.code}.png"
                >

                <div class="country-name">
                    ${country.name}
                </div>

                ${
                    index === 0
                    ?
                    `<div class="live-dot"></div>`
                    :
                    ""
                }

            </div>

            <div class="country-right">

                <button class="score">
                    ${country.score}
                </button>

                <button class="gift">
                    🏆 ${country.gifts}
                </button>

            </div>

        </div>
        `;
    });
}

/* ========================= */
/* ADD POINTS */
/* ========================= */

function addPoints(countryName,points,gifts=1){

    const country =
        countries.find(
            c => c.name === countryName
        );

    if(!country) return;

    country.score += points;
    country.gifts += gifts;

    renderLeaderboard();
}

/* ========================= */
/* FIRST RENDER */
/* ========================= */

renderLeaderboard();

/* ========================= */
/* TEST AUTO BATTLE */
/* ZMAŽ KEĎ NAPOJÍŠ LIVE.JS */
/* ========================= */

setInterval(()=>{

    const randomCountry =
        countries[
            Math.floor(
                Math.random() * countries.length
            )
        ];

    randomCountry.score +=
        Math.floor(Math.random() * 250);

    randomCountry.gifts +=
        Math.floor(Math.random() * 4);

    renderLeaderboard();

},2000);

/* ========================= */
/* LIVE.JS PRÍKLAD */
/* ========================= */

/*

Keď príde gift:

addPoints(
    "Slovensko",
    500,
    1
);

alebo:

addPoints(
    "Česko",
    1200,
    3
);

*/

</script>

</body>
</html>
