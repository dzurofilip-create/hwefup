<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>TikTok LIVE Country Battle</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;

    background:
        radial-gradient(circle at top left,#1e3c72,#0f172a 60%);

    min-height:100vh;

    padding:30px;

    overflow:hidden;
}

/* BACKGROUND PARTICLES */

body::before{
    content:"";

    position:fixed;
    inset:0;

    background-image:
        radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px);

    background-size:35px 35px;

    animation:moveBg 20s linear infinite;

    pointer-events:none;
}

@keyframes moveBg{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(35px);
    }
}

/* CONTAINER */

.container{
    width:500px;
}

/* TITLE */

.title{
    font-size:38px;
    font-weight:800;

    color:white;

    margin-bottom:25px;

    text-shadow:
        0 0 15px rgba(0,255,255,.5);
}

/* COUNTRY CARD */

.country-card{

    position:relative;

    display:flex;
    justify-content:space-between;
    align-items:center;

    width:100%;

    padding:16px 22px;

    margin-bottom:16px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(36,59,85,.95),
            rgba(20,30,48,.95)
        );

    border:2px solid rgba(255,255,255,.12);

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 20px rgba(0,170,255,.18),
        inset 0 0 12px rgba(255,255,255,.05);

    transition:.25s ease;
}

.country-card:hover{
    transform:
        translateY(-4px)
        scale(1.02);

    box-shadow:
        0 0 30px rgba(0,200,255,.35);
}

/* TOP COUNTRY SPECIAL */

.top-country{

    border:2px solid gold;

    background:
        linear-gradient(
            135deg,
            rgba(255,174,0,.18),
            rgba(20,30,48,.98)
        );

    animation:pulse 1.6s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:
            0 0 10px gold;
    }

    50%{
        box-shadow:
            0 0 35px gold;
    }

    100%{
        box-shadow:
            0 0 10px gold;
    }
}

/* LEFT */

.country-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.rank{
    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;
    font-size:14px;

    color:white;

    background:
        linear-gradient(135deg,#ff00cc,#3333ff);

    box-shadow:
        0 0 15px rgba(255,0,204,.5);
}

/* FLAG */

.flag{

    width:42px;
    height:30px;

    object-fit:cover;

    border-radius:6px;

    box-shadow:
        0 0 12px rgba(255,255,255,.25);
}

/* NAME */

.country-name{

    color:white;

    font-size:20px;
    font-weight:700;

    letter-spacing:.5px;
}

/* RIGHT SIDE */

.country-right{
    display:flex;
    align-items:center;

    gap:22px;
}

/* BUTTONS */

.score,
.gift{

    min-width:90px;
    height:46px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;
}

.score{

    background:
        rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.08),
        0 0 10px rgba(0,0,0,.25);
}

.score:hover{
    transform:scale(1.06);
}

/* GIFT BUTTON */

.gift{

    background:
        linear-gradient(
            135deg,
            #ffcc00,
            #ff6f00
        );

    box-shadow:
        0 0 18px rgba(255,170,0,.5);
}

.gift:hover{

    transform:scale(1.08);

    box-shadow:
        0 0 28px rgba(255,170,0,.8);
}

/* LEADER TEXT */

.leader-tag{

    position:absolute;

    top:-10px;
    right:20px;

    background:gold;

    color:black;

    font-size:12px;
    font-weight:800;

    padding:5px 12px;

    border-radius:999px;

    box-shadow:
        0 0 15px gold;
}

/* LIVE DOT */

.live-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#00ff66;

    box-shadow:
        0 0 15px #00ff66;

    animation:livePulse 1s infinite;
}

@keyframes livePulse{

    0%{
        transform:scale(1);
        opacity:1;
    }

    50%{
        transform:scale(1.6);
        opacity:.5;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        🌍 LIVE COUNTRY BATTLE
    </div>

    <!-- SLOVAKIA -->

    <div class="country-card top-country">

        <div class="leader-tag">
            👑 LEADER
        </div>

        <div class="country-left">

            <div class="rank">
                #1
            </div>

            <img
                class="flag"
                src="https://flagcdn.com/w80/sk.png"
            >

            <div class="country-name">
                Slovakia
            </div>

            <div class="live-dot"></div>

        </div>

        <div class="country-right">

            <button class="score">
                1500
            </button>

            <button class="gift">
                🏆 89
            </button>

        </div>

    </div>

    <!-- CZECHIA -->

    <div class="country-card">

        <div class="country-left">

            <div class="rank">
                #2
            </div>

            <img
                class="flag"
                src="https://flagcdn.com/w80/cz.png"
            >

            <div class="country-name">
                Czechia
            </div>

        </div>

        <div class="country-right">

            <button class="score">
                1100
            </button>

            <button class="gift">
                🏆 52
            </button>

        </div>

    </div>

    <!-- POLAND -->

    <div class="country-card">

        <div class="country-left">

            <div class="rank">
                #3
            </div>

            <img
                class="flag"
                src="https://flagcdn.com/w80/pl.png"
            >

            <div class="country-name">
                Poland
            </div>

        </div>

        <div class="country-right">

            <button class="score">
                980
            </button>

            <button class="gift">
                🏆 44
            </button>

        </div>

    </div>

    <!-- HUNGARY -->

    <div class="country-card">

        <div class="country-left">

            <div class="rank">
                #4
            </div>

            <img
                class="flag"
                src="https://flagcdn.com/w80/hu.png"
            >

            <div class="country-name">
                Hungary
            </div>

        </div>

        <div class="country-right">

            <button class="score">
                770
            </button>

            <button class="gift">
                🏆 32
            </button>

        </div>

    </div>

    <!-- GERMANY -->

    <div class="country-card">

        <div class="country-left">

            <div class="rank">
                #5
            </div>

            <img
                class="flag"
                src="https://flagcdn.com/w80/de.png"
            >

            <div class="country-name">
                Germany
            </div>

        </div>

        <div class="country-right">

            <button class="score">
                600
            </button>

            <button class="gift">
                🏆 21
            </button>

        </div>

    </div>

</div>

</body>
</html>
