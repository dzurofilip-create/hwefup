<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
        radial-gradient(circle at top left,#13315c,#081120 70%);

    min-height:100vh;

    padding:25px;

    overflow-x:hidden;
}

/* POZADIE */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background-image:
        radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);

    background-size:34px 34px;

    animation:bgMove 16s linear infinite;

    pointer-events:none;
}

@keyframes bgMove{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(34px);
    }
}

/* CONTAINER */

.container{
    width:520px;
}

/* NADPIS */

.title{

    color:white;

    font-size:40px;
    font-weight:800;

    margin-bottom:28px;

    text-shadow:
        0 0 18px rgba(0,255,255,.45);
}

/* KARTA */

.country-card{

    position:relative;

    display:flex;
    justify-content:space-between;
    align-items:center;

    width:100%;

    padding:16px 22px;

    margin-bottom:16px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(36,59,85,.96),
            rgba(17,25,40,.96)
        );

    border:2px solid rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    box-shadow:
        0 0 18px rgba(0,170,255,.18),
        inset 0 0 10px rgba(255,255,255,.04);

    transition:.25s;
}

.country-card:hover{

    transform:
        translateY(-4px)
        scale(1.02);

    box-shadow:
        0 0 28px rgba(0,200,255,.4);
}

/* TOP COUNTRY */

.top-country{

    border:2px solid gold;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:0 0 10px gold;
    }

    50%{
        box-shadow:0 0 28px gold;
    }

    100%{
        box-shadow:0 0 10px gold;
    }
}

.leader{

    position:absolute;

    top:-10px;
    right:18px;

    background:gold;

    color:black;

    font-size:11px;
    font-weight:800;

    padding:5px 12px;

    border-radius:999px;
}

/* ĽAVÁ STRANA */

.country-left{

    display:flex;
    align-items:center;

    gap:14px;
}

/* RANK */

.rank{

    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(135deg,#ff00cc,#3333ff);

    color:white;

    font-size:13px;
    font-weight:800;

    box-shadow:
        0 0 14px rgba(255,0,200,.45);
}

/* VLAJKA */

.flag{

    width:42px;
    height:28px;

    object-fit:cover;

    border-radius:6px;

    box-shadow:
        0 0 12px rgba(255,255,255,.2);
}

/* NÁZOV */

.country-name{

    color:white;

    font-size:20px;
    font-weight:700;
}

/* LIVE BODKA */

.live-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#00ff66;

    box-shadow:
        0 0 12px #00ff66;

    animation:livePulse 1s infinite;
}

@keyframes livePulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.5);
    }

    100%{
        transform:scale(1);
    }
}

/* PRAVÁ STRANA */

.country-right{

    display:flex;
    align-items:center;

    gap:22px;
}

/* BUTTONY */

.score,
.gift{

    min-width:88px;
    height:44px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;
}

/* SCORE */

.score{

    background:
        rgba(255,255,255,.08);

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.05);
}

/* GIFT */

.gift{

    background:
        linear-gradient(
            135deg,
            #ffcc00,
            #ff8800
        );

    box-shadow:
        0 0 16px rgba(255,170,0,.45);
}

.gift:hover{

    transform:scale(1.08);

    box-shadow:
        0 0 28px rgba(255,170,0,.7);
}

</style>
</head>
