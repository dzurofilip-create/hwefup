<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIVE SÚBOJ KRAJÍN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
        radial-gradient(circle at top left,#13315c,#081120 70%);

    min-height:100vh;

    padding:20px;

    overflow-x:hidden;
}

/* BACKGROUND */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background-image:
        radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);

    background-size:34px 34px;

    animation:bgMove 15s linear infinite;

    pointer-events:none;
}

@keyframes bgMove{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(34px);
    }
}

/* CONTAINER */

.container{
    width:520px;
}

/* TITLE */

.title{

    color:white;

    font-size:38px;
    font-weight:800;

    margin-bottom:25px;

    text-shadow:
        0 0 18px rgba(0,255,255,.4);
}

/* CARD */

.country-card{

    position:relative;

    display:flex;
    align-items:center;
    justify-content:space-between;

    width:100%;

    padding:16px 22px;

    margin-bottom:16px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            rgba(36,59,85,.95),
            rgba(17,25,40,.95)
        );

    border:2px solid rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 18px rgba(0,170,255,.15),
        inset 0 0 10px rgba(255,255,255,.04);

    transition:.35s;
}

.country-card:hover{

    transform:
        translateY(-4px)
        scale(1.02);

    box-shadow:
        0 0 30px rgba(0,200,255,.35);
}

/* LEADER */

.top-country{

    border:2px solid gold;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:0 0 10px gold;
    }

    50%{
        box-shadow:0 0 30px gold;
    }

    100%{
        box-shadow:0 0 10px gold;
    }
}

.leader{

    position:absolute;

    top:-10px;
    right:18px;

    background:gold;

    color:black;

    font-size:11px;
    font-weight:800;

    padding:5px 12px;

    border-radius:999px;

    box-shadow:
        0 0 12px gold;
}

/* LEFT */

.country-left{

    display:flex;
    align-items:center;

    gap:14px;
}

/* RANK */

.rank{

    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #ff00cc,
            #3333ff
        );

    color:white;

    font-size:13px;
    font-weight:800;

    box-shadow:
        0 0 14px rgba(255,0,200,.45);
}

/* FLAG */

.flag{

    width:42px;
    height:28px;

    object-fit:cover;

    border-radius:6px;

    box-shadow:
        0 0 12px rgba(255,255,255,.2);
}

/* NAME */

.country-name{

    color:white;

    font-size:20px;
    font-weight:700;
}

/* LIVE DOT */

.live-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#00ff66;

    box-shadow:
        0 0 12px #00ff66;

    animation:livePulse 1s infinite;
}

@keyframes livePulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.5);
    }

    100%{
        transform:scale(1);
    }
}

/* RIGHT */

.country-right{

    display:flex;
    align-items:center;

    gap:20px;
}

/* BUTTONS */

.score,
.gift{

    min-width:90px;
    height:44px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:15px;
    font-weight:700;

    transition:.25s;
}

/* SCORE */

.score{

    background:
        rgba(255,255,255,.08);

    box-shadow:
        inset 0 0 8px rgba(255,255,255,.05);
}

/* GIFT */

.gift{

    background:
        linear-gradient(
            135deg,
            #ffcc00,
            #ff8800
        );

    box-shadow:
        0 0 16px rgba(255,170,0,.45);
}

</style>
</head>

<body>

<div class="container" id="leaderboard">

<div class="title">
🌍 LIVE SÚBOJ KRAJÍN
</div>

</div>

<script>

/* COUNTRIES */

const countries = [

{
    id:"Slovensko",
    flag:"https://flagcdn.com/w80/sk.png",
    score:0,
    gifts:0
},

{
    id:"Česko",
    flag:"https://flagcdn.com/w80/cz.png",
    score:0,
    gifts:0
},

{
    id:"Poľsko",
    flag:"https://flagcdn.com/w80/pl.png",
    score:0,
    gifts:0
},

{
    id:"Maďarsko",
    flag:"https://flagcdn.com/w80/hu.png",
    score:0,
    gifts:0
},

{
    id:"Ukrajina",
    flag:"https://flagcdn.com/w80/ua.png",
    score:0,
    gifts:0
},

{
    id:"Nemecko",
    flag:"https://flagcdn.com/w80/de.png",
    score:0,
    gifts:0
},

{
    id:"Chorvátsko",
    flag:"https://flagcdn.com/w80/hr.png",
    score:0,
    gifts:0
},

{
    id:"Srbsko",
    flag:"https://flagcdn.com/w80/rs.png",
    score:0,
    gifts:0
},

{
    id:"Rakúsko",
    flag:"https://flagcdn.com/w80/at.png",
    score:0,
    gifts:0
},

{
    id:"Albánsko",
    flag:"https://flagcdn.com/w80/al.png",
    score:0,
    gifts:0
}

];

/* RENDER */

function renderLeaderboard(){

    const leaderboard =
        document.getElementById("leaderboard");

    leaderboard.innerHTML =
        `<div class="title">
            🌍 LIVE SÚBOJ KRAJÍN
        </div>`;

    countries
        .sort((a,b)=>b.score-a.score)
        .forEach((country,index)=>{

        leaderboard.innerHTML += `

        <div class="
            country-card
            ${index === 0 ? "top-country" : ""}
        ">

            ${
                index === 0
                ?
                `<div class="leader">
                    LEADER
                </div>`
                :
                ""
            }

            <div class="country-left">

                <div class="rank">
                    #${index + 1}
                </div>

                <img
                    class="flag"
                    src="${country.flag}"
                >

                <div class="country-name">
                    ${country.id}
                </div>

                ${
                    index === 0
                    ?
                    `<div class="live-dot"></div>`
                    :
                    ""
                }

            </div>

            <div class="country-right">

                <button class="score">
                    ${country.score}
                </button>

                <button class="gift">
                    🏆 ${country.gifts}
                </button>

            </div>

        </div>
        `;
    });
}

/* UPDATE SCORE */

function addPoints(countryName,points,gifts=1){

    const country =
        countries.find(
            c => c.id === countryName
        );

    if(!country) return;

    country.score += points;
    country.gifts += gifts;

    renderLeaderboard();
}

/* FIRST RENDER */

renderLeaderboard();

/* ===================================== */
/* TEST AUTO BATTLE */
/* VYMAŽ KEĎ NAPOJÍŠ live.js */
/* ===================================== */

setInterval(()=>{

    const randomCountry =
        countries[
            Math.floor(
                Math.random() * countries.length
            )
        ];

    randomCountry.score +=
        Math.floor(Math.random() * 300);

    randomCountry.gifts +=
        Math.floor(Math.random() * 5);

    renderLeaderboard();

},2000);

/* ===================================== */
/* LIVE.JS EXAMPLE */
/* ===================================== */

/*

Keď dostaneš gift z live.js:

addPoints(
    "Slovensko",
    500,
    1
);

alebo:

addPoints(
    "Česko",
    1200,
    3
);

*/

</script>

</body>
</html>
