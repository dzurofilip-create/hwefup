<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">

<style>

body{
    margin:0;
    background:transparent;
    font-family:Arial;
    overflow:hidden;
}

.board{
    width:520px;
    position:relative;
}

/* ROW */

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 14px;
    border-radius:18px;
    margin-bottom:8px;
    position:absolute;
    width:100%;
    box-sizing:border-box;
    transition:all .45s cubic-bezier(.2,.8,.2,1);

    background:linear-gradient(
        135deg,
        rgba(20,35,55,0.92),
        rgba(35,65,95,0.88)
    );

    border:1px solid rgba(120,220,255,0.35);

    box-shadow:
    0 0 15px rgba(0,180,255,0.15),
    inset 0 0 25px rgba(255,255,255,0.03);
}

/* FIRST */

.gold{

    background:linear-gradient(
        135deg,
        rgba(40,70,120,0.98),
        rgba(0,180,255,0.92)
    );

    border:1px solid rgba(255,255,255,0.35);

    box-shadow:
    0 0 25px rgba(0,200,255,0.55),
    0 0 60px rgba(0,140,255,0.25);

    transform:scale(1.02);
}

/* LEFT */

.club{
    display:flex;
    align-items:center;
    gap:12px;

    color:white;

    font-weight:bold;

    font-size:19px;

    text-shadow:
    0 0 6px rgba(0,0,0,0.7);
}

/* FLAG */

.flag{
    font-size:28px;
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.25));
}

/* RIGHT */

.right{
    display:flex;
    align-items:center;
    gap:10px;
}

/* SCORE */

.score{

    background:rgba(255,255,255,0.12);

    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(6px);

    padding:6px 12px;

    border-radius:12px;

    color:#ffffff;

    font-weight:bold;

    min-width:90px;

    text-align:center;

    font-size:16px;

    box-shadow:
    inset 0 0 10px rgba(255,255,255,0.03),
    0 0 12px rgba(0,0,0,0.25);
}

/* TITLES */

.titles{

    background:rgba(255,255,255,0.12);

    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(6px);

    padding:6px 12px;

    border-radius:12px;

    color:#ffffff;

    font-weight:bold;

    min-width:70px;

    text-align:center;

    font-size:15px;

    box-shadow:
    inset 0 0 10px rgba(255,255,255,0.03),
    0 0 12px rgba(0,0,0,0.25);
}

/* POPUP */

.points{
    position:absolute;

    right:180px;

    color:#79ffb0;

    font-weight:bold;

    font-size:20px;

    text-shadow:
    0 0 8px black;

    animation:pop 1s forwards;

    pointer-events:none;
}

@keyframes pop{

    0%{
        opacity:0;
        transform:translateY(10px) scale(0.7);
    }

    40%{
        opacity:1;
        transform:translateY(-12px) scale(1.2);
    }

    100%{
        opacity:0;
        transform:translateY(-35px) scale(1);
    }

}

/* CONTROL PANEL */

.panel{

    position:absolute;

    top:680px;

    width:520px;

    padding:14px;

    border-radius:18px;

    background:linear-gradient(
        135deg,
        rgba(15,30,50,0.96),
        rgba(25,55,90,0.92)
    );

    border:1px solid rgba(120,220,255,0.25);

    box-sizing:border-box;

    box-shadow:
    0 0 25px rgba(0,140,255,0.18);
}

.panel-title{

    color:white;

    font-weight:bold;

    margin-bottom:12px;

    font-size:18px;
}

.panel-row{

    display:flex;

    gap:8px;
}

select,
input{

    flex:1;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.15);

    color:white;

    border-radius:10px;

    padding:10px;

    outline:none;

    font-size:14px;
}

button{

    background:linear-gradient(
        135deg,
        #00bfff,
        #0078ff
    );

    border:none;

    color:white;

    padding:10px 16px;

    border-radius:10px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

button:hover{

    transform:scale(1.05);

    box-shadow:
    0 0 15px rgba(0,180,255,0.45);
}

</style>
</head>

<body>

<div id="board" class="board"></div>

<div class="panel">

    <div class="panel-title">
        ADMIN PANEL
    </div>

    <div class="panel-row">

        <select id="countrySelect"></select>

        <input id="pointsInput" type="number" placeholder="Points">

        <button onclick="addPoints()">
            ADD POINTS
        </button>

    </div>

    <br>

    <div class="panel-row">

        <select id="titleSelect"></select>

        <input id="titlesInput" type="number" placeholder="Titles">

        <button onclick="addTitles()">
            ADD TITLES
        </button>

    </div>

</div>

<script>

let clubs = [

{
    name:"Slovakia",
    flag:"🇸🇰",
    score:0,
    titles:0
},

{
    name:"Czechia",
    flag:"🇨🇿",
    score:0,
    titles:0
},

{
    name:"Poland",
    flag:"🇵🇱",
    score:0,
    titles:0
},

{
    name:"Hungary",
    flag:"🇭🇺",
    score:0,
    titles:0
},

{
    name:"Ukraine",
    flag:"🇺🇦",
    score:0,
    titles:0
},

{
    name:"Serbia",
    flag:"🇷🇸",
    score:0,
    titles:0
},

{
    name:"Germany",
    flag:"🇩🇪",
    score:0,
    titles:0
},

{
    name:"Croatia",
    flag:"🇭🇷",
    score:0,
    titles:0
},

{
    name:"Austria",
    flag:"🇦🇹",
    score:0,
    titles:0
},

{
    name:"Albania",
    flag:"🇦🇱",
    score:0,
    titles:0
}

]

const board = document.getElementById("board")

function draw(){

    clubs.sort((a,b)=>b.score-a.score)

    clubs.forEach((c,i)=>{

        let el = document.getElementById(c.name)

        if(!el){

            el = document.createElement("div")

            el.id = c.name

            el.className = "row"

            el.innerHTML = `

                <div class="club">

                    <div class="flag">
                        ${c.flag}
                    </div>

                    ${c.name}

                </div>

                <div class="right">

                    <div class="score">
                        ${c.score}
                    </div>

                    <div class="titles">
                        🏆 ${c.titles}
                    </div>

                </div>

            `

            board.appendChild(el)
        }

        el.className = i == 0 ? "row gold" : "row"

        el.style.transform = `translateY(${i * 68}px)`

        el.querySelector(".score").innerText = c.score

        el.querySelector(".titles").innerHTML = `🏆 ${c.titles}`

    })

}

const socket = new WebSocket("ws://localhost:3000")

socket.onmessage = function(event){

    let data = JSON.parse(event.data)

    let c = clubs.find(x => x.name === data.country)

    if(c){

        c.score += data.points

    }

    draw()

    if(c){

        let el = document.getElementById(c.name)

        if(el){

            let pop = document.createElement("div")

            pop.className = "points"

            pop.innerText = "+" + data.points

            el.appendChild(pop)

            setTimeout(()=>{

                pop.remove()

            },1000)

        }

    }

}

/* ADMIN */

const countrySelect = document.getElementById("countrySelect")
const titleSelect = document.getElementById("titleSelect")

clubs.forEach(c=>{

    countrySelect.innerHTML += `
        <option value="${c.name}">
            ${c.flag} ${c.name}
        </option>
    `

    titleSelect.innerHTML += `
        <option value="${c.name}">
            ${c.flag} ${c.name}
        </option>
    `

})

function addPoints(){

    const country = countrySelect.value

    const points = parseInt(
        document.getElementById("pointsInput").value
    )

    if(!points) return

    let c = clubs.find(x=>x.name === country)

    if(!c) return

    c.score += points

    draw()

    let el = document.getElementById(c.name)

    if(el){

        let pop = document.createElement("div")

        pop.className = "points"

        pop.innerText = "+" + points

        el.appendChild(pop)

        setTimeout(()=>{

            pop.remove()

        },1000)

    }

}

function addTitles(){

    const country = titleSelect.value

    const titles = parseInt(
        document.getElementById("titlesInput").value
    )

    if(!titles) return

    let c = clubs.find(x=>x.name === country)

    if(!c) return

    c.titles += titles

    draw()

}

draw()

</script>

</body>
</html>
