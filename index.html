<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIVE SÚBOJ KRAJÍN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:
        radial-gradient(circle at top left,#12284a,#081120 70%);

    min-height:100vh;

    padding:20px;

    overflow:hidden;
}

/* BACKGROUND */

body::before{

    content:"";

    position:fixed;
    inset:0;

    background-image:
        radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);

    background-size:32px 32px;

    animation:bgMove 14s linear infinite;

    pointer-events:none;
}

@keyframes bgMove{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(32px);
    }
}

/* MAIN */

.wrapper{

    display:flex;
    align-items:flex-start;
    gap:30px;
}

/* LEADERBOARD */

.container{
    width:520px;
}

/* TITLE */

.title{

    display:flex;
    align-items:center;

    gap:12px;

    color:white;

    font-size:42px;
    font-weight:800;

    margin-bottom:25px;

    text-shadow:
        0 0 20px rgba(0,255,255,.35);
}

/* CARD */

.country-card{

    position:relative;

    display:flex;
    justify-content:space-between;
    align-items:center;

    width:100%;

    padding:16px 20px;

    margin-bottom:16px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            rgba(35,58,90,.96),
            rgba(12,18,28,.96)
        );

    border:2px solid rgba(255,255,255,.08);

    backdrop-filter:blur(10px);

    box-shadow:
        0 0 18px rgba(0,170,255,.15),
        inset 0 0 10px rgba(255,255,255,.03);

    transition:.35s;
}

.country-card:hover{

    transform:
        translateY(-4px)
        scale(1.02);

    box-shadow:
        0 0 28px rgba(0,200,255,.4);
}

/* TOP COUNTRY */

.top-country{

    border:2px solid gold;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:0 0 10px gold;
    }

    50%{
        box-shadow:0 0 30px gold;
    }

    100%{
        box-shadow:0 0 10px gold;
    }
}

/* LEADER */

.leader{

    position:absolute;

    top:-10px;
    right:18px;

    background:gold;

    color:black;

    font-size:11px;
    font-weight:800;

    padding:5px 12px;

    border-radius:999px;
}

/* LEFT */

.country-left{

    display:flex;
    align-items:center;

    gap:14px;
}

/* RANK */

.rank{

    width:34px;
    height:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:13px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #ff00cc,
            #5b2dff
        );

    box-shadow:
        0 0 14px rgba(255,0,200,.4);
}

/* FLAG */

.flag{

    width:42px;
    height:28px;

    object-fit:cover;

    border-radius:6px;

    box-shadow:
        0 0 10px rgba(255,255,255,.25);
}

/* NAME */

.country-name{

    color:white;

    font-size:20px;
    font-weight:700;
}

/* LIVE DOT */

.live-dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#00ff66;

    box-shadow:
        0 0 12px #00ff66;

    animation:livePulse 1s infinite;
}

@keyframes livePulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.5);
    }

    100%{
        transform:scale(1);
    }
}

/* RIGHT */

.country-right{

    display:flex;
    align-items:center;

    gap:18px;
}

/* BUTTONS */

.score,
.gift{

    min-width:90px;
    height:44px;

    border:none;

    border-radius:14px;

    color:white;

    font-size:15px;
    font-weight:700;
}

/* SCORE */

.score{

    background:
        rgba(255,255,255,.08);
}

/* GIFT */

.gift{

    background:
        linear-gradient(
            135deg,
            #ffcc00,
            #ff8800
        );

    box-shadow:
        0 0 16px rgba(255,170,0,.45);
}

/* CONTROL PANEL */

.controls{

    width:280px;

    padding:20px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            rgba(25,35,55,.96),
            rgba(10,15,25,.96)
        );

    border:2px solid rgba(255,255,255,.08);

    box-shadow:
        0 0 20px rgba(0,170,255,.15);
}

.controls h2{

    color:white;

    margin-bottom:20px;

    font-size:24px;
}

.control-group{

    margin-bottom:16px;
}

label{

    color:white;

    display:block;

    margin-bottom:8px;

    font-size:14px;
}

select,
input{

    width:100%;

    height:44px;

    border:none;

    border-radius:12px;

    padding:0 14px;

    background:
        rgba(255,255,255,.08);

    color:white;

    font-size:15px;
}

.control-buttons{

    display:flex;
    gap:12px;

    margin-top:20px;
}

.add-btn{

    flex:1;

    height:46px;

    border:none;

    border-radius:14px;

    color:white;

    font-weight:700;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    box-shadow:
        0 0 18px rgba(0,150,255,.4);

    transition:.25s;
}

.add-btn:hover{

    transform:scale(1.05);
}

.gift-btn{

    background:
        linear-gradient(
            135deg,
            #ffcc00,
            #ff8800
        );
}

</style>
</head>

<body>

<div class="wrapper">

<!-- LEADERBOARD -->

<div class="container">

<div class="title">
🌍 LIVE SÚBOJ KRAJÍN
</div>

<div id="leaderboard"></div>

</div>

<!-- CONTROL PANEL -->

<div class="controls">

<h2>
🎮 Ovládanie
</h2>

<div class="control-group">

<label>
Krajina
</label>

<select id="countrySelect">

<option>Slovensko</option>
<option>Česko</option>
<option>Poľsko</option>
<option>Maďarsko</option>
<option>Ukrajina</option>
<option>Nemecko</option>
<option>Chorvátsko</option>
<option>Srbsko</option>
<option>Rakúsko</option>
<option>Albánsko</option>

</select>

</div>

<div class="control-group">

<label>
Body
</label>

<input
    type="number"
    id="pointsInput"
    value="100"
/>

</div>

<div class="control-group">

<label>
Gifty
</label>

<input
    type="number"
    id="giftInput"
    value="1"
/>

</div>

<div class="control-buttons">

<button
    class="add-btn"
    onclick="manualAddPoints()"
>
+ BODY
</button>

<button
    class="add-btn gift-btn"
    onclick="manualAddGift()"
>
🏆 GIFT
</button>

</div>

</div>

</div>

<script>

/* ========================= */
/* COUNTRIES */
/* ========================= */

const countries = [

{
    name:"Slovensko",
    code:"sk",
    score:0,
    gifts:0
},

{
    name:"Česko",
    code:"cz",
    score:0,
    gifts:0
},

{
    name:"Poľsko",
    code:"pl",
    score:0,
    gifts:0
},

{
    name:"Maďarsko",
    code:"hu",
    score:0,
    gifts:0
},

{
    name:"Ukrajina",
    code:"ua",
    score:0,
    gifts:0
},

{
    name:"Nemecko",
    code:"de",
    score:0,
    gifts:0
},

{
    name:"Chorvátsko",
    code:"hr",
    score:0,
    gifts:0
},

{
    name:"Srbsko",
    code:"rs",
    score:0,
    gifts:0
},

{
    name:"Rakúsko",
    code:"at",
    score:0,
    gifts:0
},

{
    name:"Albánsko",
    code:"al",
    score:0,
    gifts:0
}

];

/* ========================= */
/* RENDER */
/* ========================= */

function renderLeaderboard(){

    const leaderboard =
        document.getElementById("leaderboard");

    leaderboard.innerHTML = "";

    countries
    .sort((a,b)=>b.score-a.score)
    .forEach((country,index)=>{

        leaderboard.innerHTML += `

        <div class="
            country-card
            ${index === 0 ? "top-country" : ""}
        ">

            ${
                index === 0
                ?
                `<div class="leader">
                    LEADER
                </div>`
                :
                ""
            }

            <div class="country-left">

                <div class="rank">
                    #${index + 1}
                </div>

                <img
                    class="flag"
                    src="https://flagcdn.com/w80/${country.code}.png"
                >

                <div class="country-name">
                    ${country.name}
                </div>

                ${
                    index === 0
                    ?
                    `<div class="live-dot"></div>`
                    :
                    ""
                }

            </div>

            <div class="country-right">

                <button class="score">
                    ${country.score}
                </button>

                <button class="gift">
                    🏆 ${country.gifts}
                </button>

            </div>

        </div>
        `;
    });
}

/* ========================= */
/* ADD POINTS */
/* ========================= */

function addPoints(countryName,points,gifts=0){

    const country =
        countries.find(
            c => c.name === countryName
        );

    if(!country) return;

    country.score += Number(points);
    country.gifts += Number(gifts);

    renderLeaderboard();
}

/* ========================= */
/* MANUAL BUTTONS */
/* ========================= */

function manualAddPoints(){

    const country =
        document.getElementById("countrySelect").value;

    const points =
        document.getElementById("pointsInput").value;

    addPoints(country,points,0);
}

function manualAddGift(){

    const country =
        document.getElementById("countrySelect").value;

    const gifts =
        document.getElementById("giftInput").value;

    const points =
        gifts * 100;

    addPoints(country,points,gifts);
}

/* ========================= */
/* FIRST RENDER */
/* ========================= */

renderLeaderboard();

/* ======================================= */
/* LIVE.JS */
/* ======================================= */

/*

SEM NAPOJÍŠ SVOJ live.js

Príklad:

addPoints(
    "Slovensko",
    500,
    1
);

Keď príde gift:
- pridá body
- pridá gift
- automaticky presortuje krajiny
- leader sa zmení

*/

</script>

</body>
</html>
