<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">

<style>

body{
    margin:0;
    background:transparent;
    font-family:Arial;
    overflow:hidden;
}

.board{
    width:470px;
    position:relative;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px;
    border-radius:14px;
    margin-bottom:6px;
    position:absolute;
    width:100%;
    box-sizing:border-box;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
}

.gold{
    background:linear-gradient(90deg,#d6b15f,#f2d27c);
    box-shadow:0 0 15px rgba(255,215,0,0.6);
}

.silver{
    background:rgba(180,180,180,0.2);
    backdrop-filter:blur(6px);
}

.club{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 6px black,0 0 10px black;
    font-size:18px;
}

.logo{
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
}

.right{
    display:flex;
    align-items:center;
    gap:8px;
}

.score{
    background:rgba(255,255,255,0.92);
    padding:4px 10px;
    border-radius:8px;
    color:black;
    font-weight:bold;
    min-width:70px;
    text-align:center;
    font-size:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.25);
}

.titles{
    background:rgba(255,255,255,0.92);
    padding:4px 10px;
    border-radius:8px;
    color:black;
    font-weight:bold;
    min-width:70px;
    text-align:center;
    font-size:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.25);
}

.points{
    position:absolute;
    right:155px;
    color:#00ff6a;
    font-weight:bold;
    font-size:18px;
    text-shadow:0 0 6px black;
    animation:pop 1s forwards;
    pointer-events:none;
}

@keyframes pop{

    0%{
        opacity:0;
        transform:translateY(10px) scale(0.8);
    }

    50%{
        opacity:1;
        transform:translateY(-10px) scale(1.2);
    }

    100%{
        opacity:0;
        transform:translateY(-25px) scale(1);
    }

}

</style>
</head>

<body>

<div id="board" class="board"></div>

<script>

let clubs = [

{
    name:"Slovakia",
    emoji:"🇸🇰",
    score:0,
    titles:1
},

{
    name:"Czechia",
    emoji:"🇨🇿",
    score:0,
    titles:0
},

{
    name:"Poland",
    emoji:"🇵🇱",
    score:0,
    titles:0
},

{
    name:"Hungary",
    emoji:"🇭🇺",
    score:0,
    titles:0
},

{
    name:"Ukraine",
    emoji:"🇺🇦",
    score:0,
    titles:0
},

{
    name:"Serbia",
    emoji:"🇷🇸",
    score:0,
    titles:1
},

{
    name:"Germany",
    emoji:"🇩🇪",
    score:0,
    titles:0
},

{
    name:"Croatia",
    emoji:"🇭🇷",
    score:0,
    titles:0
},

{
    name:"Austria",
    emoji:"🇦🇹",
    score:0,
    titles:1
},

{
    name:"Albania",
    emoji:"🇦🇱",
    score:0,
    titles:0
}

]

const board = document.getElementById("board")

function draw(){

    clubs.sort((a,b)=>b.score-a.score)

    clubs.forEach((c,i)=>{

        let el = document.getElementById(c.name)

        if(!el){

            el = document.createElement("div")

            el.id = c.name

            el.className = "row"

            el.innerHTML = `

                <div class="club">

                    <div class="logo">
                        ${c.emoji}
                    </div>

                    ${c.name}

                </div>

                <div class="right">

                    <div class="score">
                        ${c.score}
                    </div>

                    <div class="titles">
                        🏆 ${c.titles}
                    </div>

                </div>

            `

            board.appendChild(el)

        }

        el.className = i == 0 ? "row gold" : "row silver"

        el.style.transform = `translateY(${i * 60}px)`

        el.querySelector(".score").innerText = c.score

        el.querySelector(".titles").innerHTML = `🏆 ${c.titles}`

    })

}

const socket = new WebSocket("ws://localhost:3000")

socket.onmessage = function(event){

    let data = JSON.parse(event.data)

    let c = clubs.find(x => x.name === data.country)

    if(c){

        c.score += data.points

    }

    draw()

    if(c){

        let el = document.getElementById(c.name)

        if(el){

            let pop = document.createElement("div")

            pop.className = "points"

            pop.innerText = "+" + data.points

            el.appendChild(pop)

            setTimeout(()=>{

                pop.remove()

            },1000)

        }

    }

}

function addTitle(countryName, amount = 1){

    let club = clubs.find(c => c.name === countryName)

    if(!club) return

    club.titles += amount

    draw()

}

function removeTitle(countryName, amount = 1){

    let club = clubs.find(c => c.name === countryName)

    if(!club) return

    club.titles -= amount

    if(club.titles < 0){

        club.titles = 0

    }

    draw()

}

draw()

</script>

</body>
</html>
