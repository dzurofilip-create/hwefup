<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

body{
margin:0;
background:transparent;
font-family:Arial;
color:white;
}

.track{
width:700px;
}

.row{
position:relative;
height:40px;
margin:6px 0;
background:linear-gradient(90deg,#111,#1a1a1a);
border-radius:8px;
overflow:hidden;
}

.row:nth-child(odd){
background:linear-gradient(90deg,#151515,#222);
}

.flag{
position:absolute;
left:5px;
top:8px;
font-size:18px;
}

.car{
position:absolute;
left:40px;
top:8px;
transition:transform 0.3s ease;
}

.finish{
position:absolute;
right:0;
top:0;
height:100%;
width:6px;
background:repeating-linear-gradient(
45deg,
white,
white 5px,
black 5px,
black 10px
);
}

.hit{
animation:hit 0.3s;
}

@keyframes hit{
0%{transform:scale(1)}
50%{transform:scale(1.4)}
100%{transform:scale(1)}
}

.win{
animation:flash 0.5s 3;
}

@keyframes flash{
0%{background:#0f0}
50%{background:#fff}
100%{background:#0f0}
}

</style>

</head>

<body>

<div id="track" class="track"></div>

<script>

const MAX_STEPS = 250;

let countries = [
"Slovakia","Czechia","Hungary","Poland","Germany",
"France","Russia","Ukraine","Austria","Italy",
"USA","China","Albania","Serbia","UK",
"Korea","Switzerland","Indonesia","Croatia","Australia"
];

let progress = {};
let wins = {};

countries.forEach(c=>{
progress[c]=0;
wins[c]=0;
});

function flagEmoji(country){
const map={
"Slovakia":"🇸🇰",
"Czechia":"🇨🇿",
"Hungary":"🇭🇺",
"Poland":"🇵🇱",
"Germany":"🇩🇪",
"France":"🇫🇷",
"Russia":"🇷🇺",
"Ukraine":"🇺🇦",
"Austria":"🇦🇹",
"Italy":"🇮🇹",
"USA":"🇺🇸",
"China":"🇨🇳",
"Albania":"🇦🇱",
"Serbia":"🇷🇸",
"UK":"🇬🇧",
"Korea":"🇰🇷",
"Switzerland":"🇨🇭",
"Indonesia":"🇮🇩",
"Croatia":"🇭🇷",
"Australia":"🇦🇺"
};
return map[country] || "🏳️";
}

function draw(){

let html="";

countries.forEach(c=>{

html+=`
<div class="row" id="${c}">
<div class="flag">${flagEmoji(c)}</div>
<div class="car" id="car-${c}">🚗</div>
<div class="finish"></div>
</div>
`;

});

document.getElementById("track").innerHTML=html;

}

draw();

function moveCar(country,steps){

progress[country]+=steps;

let percent = (progress[country]/MAX_STEPS)*100;

let car = document.getElementById("car-"+country);

if(car){

car.style.transform = `translateX(${percent*5}px)`;

car.classList.add("hit");
setTimeout(()=>car.classList.remove("hit"),300);

}

if(progress[country] >= MAX_STEPS){

let row = document.getElementById(country);

row.classList.add("win");

setTimeout(()=>{
row.classList.remove("win");
},1000);

wins[country]++;

resetRace();

}

}

function resetRace(){

countries.forEach(c=>{
progress[c]=0;
let car=document.getElementById("car-"+c);
car.style.transform="translateX(0px)";
});

}

const socket = new WebSocket("ws://localhost:3000");

socket.onmessage = function(event){

let data = JSON.parse(event.data);

let steps = data.coins * 5;

moveCar(data.country,steps);

}

</script>

</body>
</html>
